[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-space"
version = "0.1.0"
description = "Local media manager: Jellyfin sync, TMDB discovery, drive scanning, CSV updates"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["mediamanager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
